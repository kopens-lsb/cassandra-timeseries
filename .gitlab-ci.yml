# CI for cassandra-timeseries: Apache Cassandra 6.0.0 + time-series functions.
# Builds apache-cassandra-6.0.0.jar with Ant, runs the time-series unit tests, then boots the
# Docker image and runs the time-series CQL integration test before anything is released.
#
# Release path (tag push) is fully automatic and gated:
#   build-jar -> timeseries-tests -> docker-image -> docker-integration-test -> docker-image-publish + release
# On the default branch the docker chain is manual (a full image build is expensive); play
# docker-image to run it.

stages:
  - build
  - test
  - image
  - integration
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  # modules/accord is a git submodule and is required by the build.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  ANT_OPTS: "-Xmx4g"

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ant ant-optional python3 > /dev/null

build-jar:
  stage: build
  timeout: 90m
  script:
    - ant clean jar checkstyle checkstyle-test
    - ls -l build/apache-cassandra-6.0.0.jar
    # Release artifacts carry the fork's name and the tag's version (build.xml stays at
    # base.version 6.0.0 per the versioning rule - only the published copies are renamed).
    - cp build/apache-cassandra-6.0.0.jar "build/apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}.jar"
    # Full binary distribution (bin/, conf/, lib/, tools/ ...) as a tar.gz with a versioned top dir.
    - ant _artifacts-init -Dant.gen-doc.skip=true -Drat.skip=true
    - cp -al build/dist "build/apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}"
    - tar -C build -czf "build/apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}-bin.tar.gz" "apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}"
    - ls -l build/apache-cassandra-timeseries-*
  artifacts:
    name: "apache-cassandra-timeseries"
    paths:
      - build/apache-cassandra-6.0.0.jar
      - build/apache-cassandra-timeseries-*.jar
      - build/apache-cassandra-timeseries-*-bin.tar.gz
    expire_in: 1 month

# Targeted tests only — the full Cassandra suite takes hours (see AGENTS.md).
timeseries-tests:
  stage: test
  timeout: 90m
  script:
    - ant testsome -Dtest.name=org.apache.cassandra.db.aggregation.TimeBucketGapFillerTest
    - ant testsome -Dtest.name=org.apache.cassandra.cql3.functions.TimeSeriesFctsTest
    # full-text search (SAI LIKE + index_analyzer)
    - ant testsome -Dtest.name=org.apache.cassandra.index.sai.analyzer.LuceneTokenizingAnalyzerTest
    - ant testsome -Dtest.name=org.apache.cassandra.index.sai.cql.AnalyzedLikeQueryTest
    # regression guard: LIKE on non-analyzed indexes must keep demanding ALLOW FILTERING
    - ant testsome -Dtest.name=org.apache.cassandra.index.sai.cql.AllowFilteringTest
    # 3-node cluster semantics (consistency levels, paging, unrepaired rows)
    - ant test-jvm-dtest-some -Dtest.name=org.apache.cassandra.distributed.test.sai.AnalyzedLikeDistributedTest
    # tiered storage: chunk codecs (chimp128 v2, columnar v3) + version dispatcher
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.BitStreamTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.TimestampCodecTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.Chimp128CodecTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.ChunkCodecsTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.ColumnarChunkCodecTest
    # tiered storage: chunk store re-encoder (SP2) — policy, re-encode cycle, nodetool commands,
    # ALTER TABLE extensions validation
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.tiering.TieringPolicyTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.tiering.TieredStorageServiceTest
    # supported schemas (SP4): accept/reject matrix on real CQL schemas (indexes, views, counters,
    # collections), composite partition key mirroring, static-column survival, TTL vs hot_window
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.tiering.TieringSchemaSupportTest
    # multi-column re-encoding (SP4): every regular column into one columnar chunk — production
    # (tm_tag_point) shape round trip incl. nulls, per-column late merge, max writetime across all
    # columns, DESC-clustered merged reads, composite key, byte-identical idempotency
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.tiering.TieredStorageColumnsTest
    # transparent reads (SP3): chunk decode, coordinator merge, end-to-end SELECT matrix
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.tiering.ChunkReadSupportTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.tiering.ChunkMergeIteratorTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.timeseries.tiering.TransparentReadTest
    - ant testsome -Dtest.name=org.apache.cassandra.tools.nodetool.mock.TieredStorageMockTest
    - ant testsome -Dtest.name=org.apache.cassandra.cql3.validation.operations.AlterTableExtensionsTest
    # time-series compaction strategy (TSCS T1 window classification + T2 freeze state machine)
    - ant testsome -Dtest.name=org.apache.cassandra.db.compaction.TimeSeriesCompactionStrategyOptionsTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.compaction.TimeSeriesCompactionStrategyTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.compaction.TimeSeriesCompactionStrategyE2ETest
    - ant testsome -Dtest.name=org.apache.cassandra.db.compaction.timeseries.WindowFrozenListenersTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.compaction.timeseries.WindowRoutingIteratorTest
    - ant testsome -Dtest.name=org.apache.cassandra.db.compaction.timeseries.TimeWindowSplittingMultiWriterTest

# Build the Testcontainers-compatible Docker image (see docker/) and publish it as a loadable tarball to
# the GitLab GENERIC PACKAGE registry — this instance has no container registry configured (no
# registry_external_url, /jwt/auth 404), so $CI_REGISTRY_IMAGE is empty and a kaniko push cannot work.
# Switch --no-push/--tar-path back to --destination "$CI_REGISTRY_IMAGE:6.0.0" if a container registry
# is configured later.
#
# Consumption (e.g. before the plantpulse-jdbc-cassandra-driver integration tests):
#   curl -sH "PRIVATE-TOKEN: <token>" \
#     "$CI_API_V4_URL/projects/<id>/packages/generic/cassandra-timeseries-docker/<version>/cassandra-timeseries-6.0.0-docker.tar" \
#     | podman load   # or: docker load
#   ./gradlew integrationTest -Pcassandra.image=cassandra-timeseries:6.0.0
docker-image:
  stage: image
  timeout: 90m
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  # The kaniko image is busybox-based: the global before_script (apt-get) must not run here.
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile"
      --no-push
      --tar-path "$CI_PROJECT_DIR/cassandra-timeseries-6.0.0-docker.tar"
      --destination "cassandra-timeseries:6.0.0"
  artifacts:
    name: "cassandra-timeseries-6.0.0-docker"
    paths:
      - cassandra-timeseries-6.0.0-docker.tar
    expire_in: 3 days

# Release gate: boot the image that is about to be published and run the time-series CQL
# integration test against it (docker/integration-test.sh). Nothing is published or released
# unless this passes.
#
# Needs a Docker daemon, and uses the HOST's via the socket the runner already mounts
# (/var/run/docker.sock) rather than a docker:dind service. dind requires the runner to be
# configured `privileged = true`, which this runner is not — and making a shared runner privileged
# to serve one job is a bad trade. The socket works here because integration-test.sh never talks to
# the Cassandra container over the network: it starts the container and drives every command through
# `docker exec`, so the container being a sibling of this job rather than a child changes nothing.
docker-integration-test:
  stage: integration
  timeout: 60m
  needs:
    - job: docker-image
      artifacts: true
  image: docker:27-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script: []
  # Mirrors docker-image's rules — see the comment on docker-image-publish.
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - docker load -i cassandra-timeseries-6.0.0-docker.tar
    - ./docker/integration-test.sh cassandra-timeseries:6.0.0
  artifacts:
    name: "timeseries-integration-test-report"
    when: always
    paths:
      - build/timeseries-it-report.html
    expire_in: 1 month

# Upload the image tarball to the generic package registry so it has a stable, tokened download URL
# (job artifacts expire; packages do not).
docker-image-publish:
  stage: release
  timeout: 30m
  needs:
    - job: docker-image
      artifacts: true
    - job: docker-integration-test
      artifacts: false
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  before_script: []
  # Must mirror docker-image's rules: it needs docker-image's artifact, and a job that needs an
  # optional manual job is created as "skipped" if that manual job has not run — so with plain
  # on_success rules here this job could never run on the default branch, only on tags.
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    # Folded block scalar: a plain scalar cannot contain ": " (the JOB-TOKEN header), which broke the pipeline.
    - >-
      curl --fail --silent --show-error -H "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file cassandra-timeseries-6.0.0-docker.tar
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cassandra-timeseries-docker/${CI_COMMIT_TAG:-6.0.0}/cassandra-timeseries-6.0.0-docker.tar"

# On tag pushes (e.g. 6.0.0-r1), publish a GitLab Release pointing at the built jar.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-jar
      artifacts: false
    - job: docker-integration-test
      artifacts: false
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Industrial time-series Cassandra (base Apache Cassandra 6.0.0) — $CI_COMMIT_TAG"
    assets:
      links:
        # Artifact refs use the commit SHA, not the tag name - a tag and the release branch can
        # share the name "6.0.0" and a SHA ref is never ambiguous.
        - name: "apache-cassandra-timeseries-${CI_COMMIT_TAG}-bin.tar.gz"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/build/apache-cassandra-timeseries-${CI_COMMIT_TAG}-bin.tar.gz?job=build-jar"
        - name: "apache-cassandra-timeseries-${CI_COMMIT_TAG}.jar"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/build/apache-cassandra-timeseries-${CI_COMMIT_TAG}.jar?job=build-jar"
