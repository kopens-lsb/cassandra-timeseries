# CI for cassandra-timeseries: Apache Cassandra 6.0.0 + time-series functions.
# Builds apache-cassandra-6.0.0.jar with Ant and runs the time-series unit tests.

stages:
  - build
  - test
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  # modules/accord is a git submodule and is required by the build.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  ANT_OPTS: "-Xmx4g"

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ant ant-optional python3 > /dev/null

build-jar:
  stage: build
  timeout: 90m
  script:
    - ant clean jar checkstyle checkstyle-test
    - ls -l build/apache-cassandra-6.0.0.jar
  artifacts:
    name: "apache-cassandra-6.0.0"
    paths:
      - build/apache-cassandra-6.0.0.jar
    expire_in: 1 month

# Targeted tests only — the full Cassandra suite takes hours (see AGENTS.md).
timeseries-tests:
  stage: test
  timeout: 60m
  script:
    - ant testsome -Dtest.name=org.apache.cassandra.db.aggregation.TimeBucketGapFillerTest
    - ant testsome -Dtest.name=org.apache.cassandra.cql3.functions.TimeSeriesFctsTest

# Publish the Testcontainers-compatible Docker image (see docker/) to the GitLab container registry.
# Runs on tag pushes automatically and on-demand (manual) on master. The image is consumed by the
# plantpulse-jdbc-cassandra-driver integration tests via -Pcassandra.image=$CI_REGISTRY_IMAGE:6.0.0.
# kaniko builds the multi-stage docker/Dockerfile without a Docker daemon; the full Cassandra build
# happens inside the image build, so this job does not depend on build-jar artifacts.
docker-image:
  stage: release
  timeout: 90m
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:6.0.0"
      --destination "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-latest}"

# On tag pushes (e.g. 6.0.0-r1), publish a GitLab Release pointing at the built jar.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-jar
      artifacts: false
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Apache Cassandra 6.0.0 + time-series functions ($CI_COMMIT_TAG)"
    assets:
      links:
        - name: "apache-cassandra-6.0.0.jar"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/build/apache-cassandra-6.0.0.jar?job=build-jar"
